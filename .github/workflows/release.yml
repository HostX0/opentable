name: Release

# Tag a commit to cut a release:
#   npm version minor && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Creating a GitHub Release needs write access to repository contents.
# GITHUB_TOKEN is read-only by default, which fails the publish step with 403.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # electron-builder only packages — it does not compile. Without this the
      # out/ directory is missing and packaging fails on every platform.
      - name: Build
        run: npm run build

      # electron-builder only *warns* when it cannot sign, then publishes an
      # unsigned macOS app that Gatekeeper reports to users as "damaged".
      # Fail here instead, unless the release is deliberately unsigned.
      - name: Require macOS signing credentials
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_MAC }}
        run: |
          missing=""
          [ -z "$CSC_LINK" ] && missing="$missing MAC_CERT_P12"
          [ -z "$CSC_KEY_PASSWORD" ] && missing="$missing MAC_CERT_PASSWORD"
          if [ -n "$missing" ]; then
            if [ "$ALLOW_UNSIGNED" = "true" ]; then
              echo "::warning::Unsigned macOS build (missing:$missing) — ALLOW_UNSIGNED_MAC is set."
              exit 0
            fi
            echo "::error::Missing secret(s):$missing"
            echo "An unsigned macOS build opens as \"OpenTable is damaged\" on every other Mac"
            echo "and can never auto-update. See docs/RELEASING.md for how to produce these."
            echo "To ship unsigned anyway, set repository variable ALLOW_UNSIGNED_MAC=true."
            exit 1
          fi

      # A step's own `env` is not visible to its `if`, so the presence check
      # happens inside the script rather than in a condition.
      # A step's own `env` is not visible to its `if`, so the presence check
      # happens inside the script rather than in a condition.
      - name: Stage the notarisation key
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::No APPLE_API_KEY_P8 secret — the macOS build will be unsigned and cannot auto-update."
            exit 0
          fi
          mkdir -p ~/private_keys
          key=~/private_keys/AuthKey.p8

          # Accept either form of the secret: the base64 of the .p8 (what the
          # docs ask for) or the .p8 text pasted in directly. Whitespace is
          # stripped first so base64 wrapped at any width still decodes.
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_P8" | tr -d '[:space:]' | openssl base64 -d -A > "$key" 2>/dev/null || true
          fi

          # openssl parses it, so a truncated or wrong-file secret fails here
          # rather than three minutes later inside notarytool.
          if ! openssl pkey -in "$key" -noout 2>/dev/null; then
            echo "::error::APPLE_API_KEY_P8 is not a usable private key."
            echo "It holds ${#APPLE_API_KEY_P8} characters. Re-create it from the .p8 Apple gave you:"
            echo "    base64 -i AuthKey_XXXXXXXXXX.p8 | pbcopy"
            echo "then paste into Settings > Secrets and variables > Actions > APPLE_API_KEY_P8."
            exit 1
          fi
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Build and publish
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          # Creating the GitHub Release. Provided automatically by Actions.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # macOS signing + notarisation. Without these the mac build is
          # unsigned and CANNOT auto-update — see docs/RELEASING.md.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

          # Windows signing (optional; unsigned installers trigger SmartScreen).
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
